# BenShemen Hatal profile (private off-road dataset at
# /home/doron-linux/datasets/BenShemen Hatal/, outside this repo). Ouster
# OS1-64-U02-SR LiDAR with its own embedded IMU, captured as raw pcap (not a
# ROS bag) alongside separate RGB/IR cameras and a 1Hz RTK-GNSS log -- see
# the "BenShemen Hatal Dataset" section in VALIDATION_LOG.md for the full
# raw-data review this profile is based on. Only LiDAR+IMU are wired up here
# (same Ouster-internal-IMU-only pattern as `enwide`/`rellis`); the cameras
# aren't consumed by mimosa at all (Photometric uses the Ouster's own
# NIR/signal channel, not an external camera feed) and the RTK log is only
# usable as an external, uncorrected-lever-arm ground-truth sanity check.
#
# The raw pcap has no ROS2 bag; convert it first with the one-off
# `scripts/convert_benshemen_pcap.py` (ouster-cli's own `save --ros2` only
# writes raw undecoded packet topics, not usable by mimosa -- see
# VALIDATION_LOG.md's environment note on the ouster-sdk/rosbags conflict
# this also surfaced).
#
# UNVALIDATED / TODO before trusting results from this profile:
#   - T_B_S below is derived directly from this sensor's own
#     `os_benshemen.json` metadata (`lidar_to_sensor_transform` and
#     `imu_intrinsics.imu_to_sensor_transform`), composed the same way as
#     rellis/enwide's (validated by reproducing rellis's known-correct
#     value exactly from the same formula): rotation is 180deg about Z
#     (matches the Ouster lidar_to_sensor_transform's rotation sub-matrix,
#     same Known Issue #10 pattern -- not left as identity this time).
#     Translation = (lidar-to-sensor translation) minus (imu-to-sensor
#     translation) = (0.038195-0.007533, 0-(-0.009725), 0-(-0.002441))
#     component-wise per axis = (0.002441, 0.009725, 0.030662) m. Both
#     sessions in the dataset share identical metadata (same physical
#     sensor unit, serial 122541002747), so this applies to either.
#   - pose_init_max_gyro_std/pose_init_max_acc_std are loosened far past
#     every other profile's defaults (0.02->0.08 rad/s, 0.2->1.1 m/s^2).
#     Verified necessary, not just convenient: scanned the *entire* IMU
#     stream of both recording sessions in 1s sliding windows using
#     mimosa's own stationarity formula (combined accel/gyro RMS, not
#     per-axis) -- zero windows anywhere in either session pass the
#     default thresholds (best achievable: acc_std~0.99 m/s^2, gyro_std
#     ~0.051 rad/s), so this rig is never still enough to init by default,
#     in a way that's consistent between two independent recordings (same
#     floor in both) -- most likely continuous platform/mounting vibration,
#     not a one-off fluke. gyro_mean and gravity_error stay well within
#     their own defaults throughout (~0.01 rad/s, <0.08 m/s^2), i.e. the
#     windows this admits are genuinely not rotating/falling, just
#     vibrating -- not blindly loosened to paper over real motion. With
#     these values, session 2 initializes ~6.5s in. Still means the initial
#     attitude/bias estimate comes from a noisier window than any other
#     validated profile's stationary init -- treat early-trajectory
#     results with more caution than enwide/rellis.
#   - IMU noise densities borrowed verbatim from enwide/rellis, unverified
#     for this specific IMU.
#   - lidar.photometric is disabled for a first pass even though
#     `os_benshemen.json` (unlike rellis's os_dummy.json placeholder) has
#     this sensor's real 64-beam intrinsics -- enabling it is plausible
#     here but not attempted yet.
#   - RTK ground truth (`bs-1.csv`/`bs29-9-5.csv`) needs the fixes from
#     VALIDATION_LOG.md's dataset-review section before use (session 1's
#     file needs clipping to the actual recording window; no documented
#     GNSS-antenna-to-LiDAR lever arm exists to correct for, unlike
#     RELLIS-3D).

logs_directory: /tmp/mimosa/
map_frame: mimosa_map
navigation_frame: mimosa_navigation
body_frame: mimosa_body

imu:
  topic: /os1_cloud_node/imu
  manager:
    log_level: info
    max_buffer_duration: 1.1
    pose_init_wait_secs: 1.0
    pose_init_max_acc_std: 1.1 # m/s^2 -- loosened from default 0.2, see header note
    pose_init_max_gyro_std: 0.08 # rad/s -- loosened from default 0.02, see header note
    interpolation_max_ts_diff: 1 #s
    extrapolation_max_ts_diff: 0.15 #s
    acc_scale_factor: 1
    initial_yaw: configuration
    initial_yaw_deg: 0.0
  preintegration:
    acc_noise_density: 0.2 # [ m / s^2 / sqrt(Hz) ] -- borrowed from enwide/rellis, unverified for this IMU
    acc_bias_random_walk: 0.05 # [ m / s^3 / sqrt(Hz) ]
    gyro_noise_density: 0.026179938 # [ rad / s / sqrt(Hz) ] -- borrowed from enwide/rellis, unverified
    gyro_bias_random_walk: 0.001 # [ rad / s^2 / sqrt(Hz) ]
    integration_sigma: 1.0e-4 # Numerical uncertainty from integrating position from velocity
    use_2nd_order_coriolis: false
    use_estimated_gravity: false
    gravity: [0.0, 0.0, -9.806] # [m/s^2] Gravity vector in the navigation frame
    gravity_aligned_initialization: false

graph:
  manager:
    log_level: trace
    max_measurement_latency: 0.25 # seconds
    smoother:
      lag: 0.5
      wildfire_threshold: 0.001
      relinearize_threshold_translation: 5.0e-3
      relinearize_threshold_rotation: 1.75e-2
      relinearize_threshold_velocity: 5.0e-2
      relinearize_threshold_bias_acc: 1.0e-1
      relinearize_threshold_bias_gyro: 1.0e-1
      relinearize_threshold_gravity: 1.0e-2
      relinearize_skip: 1
      enable_relinearization: true
      evaluate_nonlinear_error: false
      factorization: QR
      cache_linearized_factors: true
      enable_detailed_results: false
      enable_partial_relinearization_check: true
      initial_position_sigma: 1.0e-6
      initial_rotation_yaw_sigma_deg: 1.0e-6
      initial_rotation_pitch_roll_sigma_deg: 1.0e-6
      initial_velocity_sigma: 1.0e-1
      initial_bias_acc_sigma: 1.0
      initial_bias_gyro_sigma: 1.0e-1
      initial_gravity_sigma: 5.0e-1
      additional_update_iterations: 5

lidar:
  topic: /os1_cloud_node/points
  sensor_frame: mimosa_lidar
  T_B_S: [0.002441, 0.009725, 0.030662, 0, 0, 1, 0] # x, y, z, x, y, z, w -- derived from os_benshemen.json, see header note; rotation is 180deg about Z, Known Issue #10 pattern
  T_B_OdometryLoggerFrame: [0, 0, 0, 0, 0, 0, 1] # x, y, z, x, y, z, w
  manager:
    log_level: trace
    enabled: true
    use_to_init: true
    initial_skip: 0
    transpose_pointcloud: false
    organize_pointcloud_by_ring: false
    ts_offset: 0
    range_min: 0.2
    range_max: 100
    intensity_min: 0
    intensity_max: 1.0e+10
    create_full_res_pointcloud: true
    full_res_pointcloud_publish_rate_divisor: 2
    use_reflectivity_as_intensity: false
    scale_intensity_by_sq_range: false
    near_range_correction: true
  geometric:
    log_level: trace
    enabled: true
    point_skip_divisor: 4
    ring_skip_divisor: 1
    map_keyframe_trans_thresh: 2
    map_keyframe_rot_thresh_deg: 30
    initial_clouds_to_force_map_update: 1
    lru_horizon: 1000
    neighbor_voxel_mode: 19
    scan_to_map:
      source_voxel_grid_filter_leaf_size: 0.5
      source_voxel_grid_min_dist_in_voxel: 0.15
      target_ivox_map_leaf_size: 0.5
      target_ivox_map_min_dist_in_voxel: 0.15
      num_corres_points: 5
      max_corres_distance: 1
      plane_validity_distance: 0.07
      lidar_point_noise_std_dev: 0.07
      use_huber: true
      huber_threshold: 1.345
      reg_4_dof: false
      project_on_degneneracy: false
      degen_thresh_trans: 40
      degen_thresh_rot: 0
  photometric:
    log_level: trace
    enabled: false # see header note -- real beam intrinsics exist here, just not attempted yet
    destagger: false
    visualize: false
    range_min: 0.5 # Needed to avoid division by zero
    range_max: 30
    static_mask_path: ""
    erosion_buffer: 10
    patch_size: 5
    margin_size: 10
    intensity_scale: 0.25
    intensity_gamma: 1
    remove_lines: true
    filter_brightness: true
    gaussian_blur: true
    gaussian_blur_size: 3
    gradient_threshold: 10
    max_dist_from_mean: 3
    max_dist_from_plane: 0.5
    num_features_detect: 60
    keyframe_num_features_min: 15
    consecutive_frame_num_features_detect: 10
    nma_radius: 11
    occlusion_range_diff_threshold: 0.2
    max_feature_life_time: 1000
    high_pass_fir: [-0.00122687, -0.00152587,  0.0009631,   0.00382838,  0.00071422, -0.00765637, -0.00681285,  0.01015542,  0.01944999, -0.00536835, -0.03792929, -0.01565801,  0.05816374,  0.07138264, -0.07402277, -0.30572514,  0.5802669,  -0.30572514, -0.07402277,  0.07138264,  0.05816374, -0.01565801, -0.03792929, -0.00536835,  0.01944999,  0.01015542, -0.00681285, -0.00765637,  0.00071422,  0.00382838,  0.0009631,  -0.00152587, -0.00122687]
    low_pass_fir: [-0.0013038,  -0.00117813, -0.00102349, -0.00051396,  0.000759,    0.00322145, 0.00724004,  0.01304552,  0.02066957,  0.02990645,  0.04030759,  0.0512121, 0.06181081,  0.07123596,  0.07866427,  0.08341891,  0.08505541,  0.08341891, 0.07866427,  0.07123596,  0.06181081,  0.0512121,   0.04030759,  0.02990645, 0.02066957,  0.01304552,  0.00724004,  0.00322145,  0.000759,   -0.00051396, -0.00102349, -0.00117813, -0.0013038, ]
    brightness_window_size: [41, 7]
    rotate_patch_to_align_with_gradient: false
    edgelet_patch_offsets: [[-2, -2], [-1, -2], [0, -2], [1, -2], [2, -2], [-2, -1], [-1, -1], [0, -1], [1, -1], [2, -1], [-2, 0], [-1, 0], [0, 0], [1, 0], [2, 0], [-2, 1], [-1, 1], [0, 1], [1, 1], [2, 1], [-2, 2], [-1, 2], [0, 2], [1, 2], [2, 2]]
    use_robust_cost_function: false
    robust_cost_function: huber
    robust_cost_function_parameter: 1.345
    error_scale: 1
    sigma: 0.25
    max_error: 0.5075
